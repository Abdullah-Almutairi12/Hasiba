<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'arabic': ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>::-webkit-scrollbar { display: none;}</style>
</head>
<body class="bg-gray-50 font-arabic" dir="rtl">

    <header id="header" class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-reverse space-x-4">
                    <div class="flex items-center">
                        <i class="fa-solid fa-cash-register text-2xl text-blue-600 ml-3"></i>
                        <h1 class="text-xl font-bold text-gray-900">نظام الكاشير</h1>
                    </div>
                </div>
                <div class="flex items-center space-x-reverse space-x-4">
                    <span class="text-sm text-gray-600">المستخدم: أحمد محمد</span>
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-8 h-8 rounded-full">
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div id="product-search" class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-900">البحث عن المنتجات</h2>
                        <i class="fa-solid fa-search text-gray-400"></i>
                    </div>
                    
                    <div class="relative mb-6">
                        <input type="text" id="product-search-input" placeholder="ابحث عن المنتج بالاسم أو الباركود..." 
                               class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <i class="fa-solid fa-search absolute right-3 top-4 text-gray-400"></i>
                    </div>

                    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <div class="product-item bg-gray-50 rounded-lg p-4 cursor-pointer hover:bg-blue-50 transition-colors" onclick="addProduct('شامبو هيد آند شولدرز', 45.50)">
                            <div class="text-center">
                                <i class="fa-solid fa-pump-soap text-3xl text-blue-500 mb-2"></i>
                                <h3 class="font-medium text-sm text-gray-900 mb-1">شامبو هيد آند شولدرز</h3>
                                <p class="text-lg font-bold text-blue-600">45.50 ريال</p>
                            </div>
                        </div>
                        
                        <div class="product-item bg-gray-50 rounded-lg p-4 cursor-pointer hover:bg-blue-50 transition-colors" onclick="addProduct('معجون أسنان كولجيت', 12.75)">
                            <div class="text-center">
                                <i class="fa-solid fa-tooth text-3xl text-green-500 mb-2"></i>
                                <h3 class="font-medium text-sm text-gray-900 mb-1">معجون أسنان كولجيت</h3>
                                <p class="text-lg font-bold text-blue-600">12.75 ريال</p>
                            </div>
                        </div>
                        
                        <div class="product-item bg-gray-50 rounded-lg p-4 cursor-pointer hover:bg-blue-50 transition-colors" onclick="addProduct('صابون لوكس', 8.25)">
                            <div class="text-center">
                                <i class="fa-solid fa-soap text-3xl text-purple-500 mb-2"></i>
                                <h3 class="font-medium text-sm text-gray-900 mb-1">صابون لوكس</h3>
                                <p class="text-lg font-bold text-blue-600">8.25 ريال</p>
                            </div>
                        </div>
                        
                        <div class="product-item bg-gray-50 rounded-lg p-4 cursor-pointer hover:bg-blue-50 transition-colors" onclick="addProduct('مناديل ورقية', 15.00)">
                            <div class="text-center">
                                <i class="fa-solid fa-tissue text-3xl text-yellow-500 mb-2"></i>
                                <h3 class="font-medium text-sm text-gray-900 mb-1">مناديل ورقية</h3>
                                <p class="text-lg font-bold text-blue-600">15.00 ريال</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="cart-summary" class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 sticky top-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-900">سلة المشتريات</h2>
                        <i class="fa-solid fa-shopping-cart text-gray-400"></i>
                    </div>
                    
                    <div id="cart-total" class="bg-blue-50 rounded-lg p-4 mb-4">
                        <div class="flex justify-between items-center">
                            <span class="text-lg font-semibold text-gray-700">المجموع الكلي:</span>
                            <span id="total-amount" class="text-2xl font-bold text-blue-600">0.00 ريال</span>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <button class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors">
                            <i class="fa-solid fa-credit-card ml-2"></i>
                            دفع نقدي
                        </button>
                        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors">
                            <i class="fa-solid fa-credit-card ml-2"></i>
                            دفع بالبطاقة
                        </button>
                        <button class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors" onclick="clearCart()">
                            <i class="fa-solid fa-trash ml-2"></i>
                            مسح السلة
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="cart-table" class="mt-8 bg-white rounded-lg shadow-sm border border-gray-200">
            <div class="p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">تفاصيل المشتريات</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200">
                                <th class="text-right py-3 px-4 font-semibold text-gray-700">الصنف</th>
                                <th class="text-center py-3 px-4 font-semibold text-gray-700">الكمية</th>
                                <th class="text-center py-3 px-4 font-semibold text-gray-700">سعر الوحدة</th>
                                <th class="text-center py-3 px-4 font-semibold text-gray-700">المجموع</th>
                                <th class="text-center py-3 px-4 font-semibold text-gray-700">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items">
                            <tr>
                                <td colspan="5" class="text-center py-8 text-gray-500">
                                    <i class="fa-solid fa-shopping-cart text-4xl text-gray-300 mb-2"></i>
                                    <p>لم يتم إضافة أي منتجات بعد</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let cart = [];
        let cartTotal = 0;

        function addProduct(name, price) {
            const existingItem = cart.find(item => item.name === name);
            
            if (existingItem) {
                existingItem.quantity += 1;
                existingItem.total = existingItem.quantity * existingItem.price;
            } else {
                cart.push({
                    name: name,
                    price: price,
                    quantity: 1,
                    total: price
                });
            }
            
            updateCartDisplay();
        }

        function updateQuantity(index, newQuantity) {
            if (newQuantity <= 0) {
                removeItem(index);
                return;
            }
            
            cart[index].quantity = newQuantity;
            cart[index].total = cart[index].quantity * cart[index].price;
            updateCartDisplay();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        function clearCart() {
            cart = [];
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const cartItemsElement = document.getElementById('cart-items');
            const totalAmountElement = document.getElementById('total-amount');
            
            cartTotal = cart.reduce((sum, item) => sum + item.total, 0);
            totalAmountElement.textContent = cartTotal.toFixed(2) + ' ريال';
            
            if (cart.length === 0) {
                cartItemsElement.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-8 text-gray-500">
                            <i class="fa-solid fa-shopping-cart text-4xl text-gray-300 mb-2"></i>
                            <p>لم يتم إضافة أي منتجات بعد</p>
                        </td>
                    </tr>
                `;
            } else {
                cartItemsElement.innerHTML = cart.map((item, index) => `
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="py-4 px-4">
                            <div class="font-medium text-gray-900">${item.name}</div>
                        </td>
                        <td class="py-4 px-4 text-center">
                            <div class="flex items-center justify-center space-x-reverse space-x-2">
                                <button onclick="updateQuantity(${index}, ${item.quantity - 1})" class="w-8 h-8 bg-gray-200 hover:bg-gray-300 rounded-full flex items-center justify-center">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                <span class="w-12 text-center font-semibold">${item.quantity}</span>
                                <button onclick="updateQuantity(${index}, ${item.quantity + 1})" class="w-8 h-8 bg-gray-200 hover:bg-gray-300 rounded-full flex items-center justify-center">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        </td>
                        <td class="py-4 px-4 text-center font-semibold text-blue-600">${item.price.toFixed(2)} ريال</td>
                        <td class="py-4 px-4 text-center font-bold text-green-600">${item.total.toFixed(2)} ريال</td>
                        <td class="py-4 px-4 text-center">
                            <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 p-2">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }
        }
    </script>

</body>
</html>
