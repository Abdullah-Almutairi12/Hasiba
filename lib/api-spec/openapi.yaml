  /admin/invoice-send-failures/{alertId}/retry:
    post:
      tags: [admin]
      summary: One-click retry of a failed invoice email send
      description: >-
        Resets the underlying outbox row's `attempts` counter and clears
        `next_retry_at` so the background invoice email retry worker picks
        it up on the next sweep. On success, marks the alert as read.
      operationId: retryInvoiceSendFailure
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Retry queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  outboxId: { type: integer, nullable: true }
                required: [ok]
        "404":
          description: Alert or outbox row not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
        "409":
          description: Outbox row is no longer retriable (already sent, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]

