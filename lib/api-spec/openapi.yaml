openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: حاسبة.AI - ERP System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard & KPIs
  - name: products
    description: Products & Inventory
  - name: pos
    description: Point of Sale
  - name: invoices
    description: Supplier Invoices
  - name: accounting
    description: Accounting & Compliance
  - name: reports
    description: Reports & Analytics
  - name: customers
    description: Customers
  - name: branches
    description: Branches
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPIs and summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/sales-chart:
    get:
      operationId: getDashboardSalesChart
      tags: [dashboard]
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [weekly, monthly, yearly]
            default: weekly
      summary: Get sales chart data
      responses:
        "200":
          description: Sales chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesChartPoint"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Get AI alerts
      responses:
        "200":
          description: AI alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/branch-performance:
    get:
      operationId: getBranchPerformance
      tags: [dashboard]
      summary: Get branch comparison data
      responses:
        "200":
          description: Branch performance list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchPerformance"

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products/categories:
    get:
      operationId: listProductCategories
      tags: [products]
      summary: List product categories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /products/stats:
    get:
      operationId: getProductStats
      tags: [products]
      summary: Get product & inventory stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStats"

  # POS
  /pos/sessions:
    get:
      operationId: listPosSessions
      tags: [pos]
      summary: List POS sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosSession"
    post:
      operationId: createPosSession
      tags: [pos]
      summary: Open new POS session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSession"

  /pos/orders:
    get:
      operationId: listPosOrders
      tags: [pos]
      summary: List POS orders
      parameters:
        - name: sessionId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosOrder"
    post:
      operationId: createPosOrder
      tags: [pos]
      summary: Create POS order / sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOrder"

  /pos/summary:
    get:
      operationId: getPosSummary
      tags: [pos]
      summary: Get POS daily summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSummary"

  # Supplier Invoices
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List supplier invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, done, failed, needs_review]
      responses:
        "200":
          description: Invoices list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a supplier invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/stats:
    get:
      operationId: getInvoiceStats
      tags: [invoices]
      summary: Get invoice processing stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceStats"

  # Accounting
  /accounting/journal-entries:
    get:
      operationId: listJournalEntries
      tags: [accounting]
      summary: List journal entries
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [accounting]
      summary: Create journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /accounting/summary:
    get:
      operationId: getAccountingSummary
      tags: [accounting]
      summary: Get accounting KPIs (cash flow, receivables, payables)
      responses:
        "200":
          description: Accounting summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingSummary"

  /accounting/zatca-status:
    get:
      operationId: getZatcaStatus
      tags: [accounting]
      summary: Get ZATCA compliance status
      responses:
        "200":
          description: ZATCA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZatcaStatus"

  # Reports
  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [reports]
      summary: Get sales analytics report
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly]
            default: monthly
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"

  /reports/ai-summary:
    get:
      operationId: getAiReportSummary
      tags: [reports]
      summary: Get AI-generated daily report summary
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReportSummary"

  /reports/top-products:
    get:
      operationId: getTopProducts
      tags: [reports]
      summary: Get top selling products
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProduct"

  /reports/insights:
    get:
      operationId: getReportInsights
      tags: [reports]
      summary: Get AI-powered insights, anomalies, and benchmarks
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportInsights"

  /reports/fraud-detection:
    get:
      operationId: getFraudDetection
      tags: [reports]
      summary: Get suspicious transactions detected by AI
      responses:
        "200":
          description: Fraud alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FraudAlert"

  # Customers
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  # Branches
  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List branches
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"

  /warehouses:
    get:
      operationId: listWarehouses
      tags: [warehouses]
      summary: List warehouses
      parameters:
        - in: query
          name: branchId
          schema:
            type: integer
      responses:
        "200":
          description: Warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"
    post:
      operationId: createWarehouse
      tags: [warehouses]
      summary: Create a warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarehouseBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/roles:
    get:
      operationId: listRoles
      tags: [users]
      summary: List role templates with permissions
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /security/checklist:
    get:
      operationId: getSecurityChecklist
      tags: [security]
      summary: Get NCA ECC security checklist
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityChecklist"

  /security/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [security]
      summary: List recent audit logs
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ===== Admin Control Panel =====
  /admin/stats:
    get:
      tags: [admin]
      summary: Admin dashboard KPIs
      operationId: getAdminStats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/system:
    get:
      tags: [admin]
      summary: System health and metrics
      operationId: getAdminSystemHealth
      responses:
        "200":
          description: System health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystemHealth"

  /admin/tickets:
    get:
      tags: [admin]
      summary: List support tickets
      operationId: listSupportTickets
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
    post:
      tags: [admin]
      summary: Create a support ticket
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string }
                message: { type: string }
                customerName: { type: string }
                customerEmail: { type: string }
                priority: { type: string }
                category: { type: string }
              required: [subject, message, customerName, customerEmail]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"

  /admin/tickets/{id}:
    patch:
      tags: [admin]
      summary: Update support ticket
      operationId: updateSupportTicket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                reply: { type: string }
                priority: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"

  /admin/announcements:
    get:
      tags: [admin]
      summary: List announcements
      operationId: listAnnouncements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      tags: [admin]
      summary: Create announcement
      operationId: createAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                message: { type: string }
                type: { type: string }
                expiresAt: { type: string, nullable: true }
              required: [title, message, type]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /admin/announcements/{id}:
    delete:
      tags: [admin]
      summary: Delete announcement
      operationId: deleteAnnouncement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /admin/feature-flags:
    get:
      tags: [admin]
      summary: List feature flags
      operationId: listFeatureFlags
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureFlag"

  /admin/feature-flags/{key}:
    patch:
      tags: [admin]
      summary: Toggle feature flag
      operationId: updateFeatureFlag
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isEnabled: { type: boolean }
              required: [isEnabled]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"

  /admin/active-announcements:
    get:
      tags: [admin]
      summary: Active announcements visible to any logged-in user
      operationId: listActiveAnnouncements
      responses:
        "200":
          description: Active announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"


  /ai/models:
    get:
      tags: [ai]
      summary: List AI models
      operationId: listAiModels
      responses:
        "200":
          description: AI models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModel"

  /ai/models/{key}/train:
    post:
      tags: [ai]
      summary: Train a single AI model on real DB data
      operationId: trainAiModel
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Trained
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  accuracy: { type: number }
                  trainingSize: { type: integer }
                required: [ok]

  /ai/models/train-all:
    post:
      tags: [ai]
      summary: Retrain all AI models
      operationId: trainAllAiModels
      responses:
        "200":
          description: Results per model
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        ok: { type: boolean }
                        accuracy: { type: number }
                        error: { type: string }

  /ai/predict/sales-forecast:
    get:
      tags: [ai]
      summary: 7-day sales forecast
      operationId: getSalesForecast
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecast:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        predicted: { type: number }
                      required: [date, predicted]
                required: [forecast]

  /ai/predict/at-risk-customers:
    get:
      tags: [ai]
      summary: Customers at risk of churn
      operationId: getAtRiskCustomers
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: At-risk customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      type: object
                      properties:
                        customerId: { type: integer }
                        name: { type: string }
                        riskScore: { type: number }
                        daysSinceLastOrder: { type: integer }
                        totalSpent: { type: number }
                      required: [customerId, name, riskScore]

  /ai/predict/fraud-anomalies:
    get:
      tags: [ai]
      summary: Anomalous orders detected
      operationId: getFraudAnomalies
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Anomalies
          content:
            application/json:
              schema:
                type: object
                properties:
                  anomalies:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId: { type: integer }
                        amount: { type: number }
                        zScore: { type: number }
                        reason: { type: string }
                        createdAt: { type: string }
                      required: [orderId, amount, zScore]

  /ai/predict/recommendations:
    get:
      tags: [ai]
      summary: Top product recommendations from basket analysis
      operationId: getProductRecommendations
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        productAId: { type: integer }
                        productAName: { type: string }
                        productBId: { type: integer }
                        productBName: { type: string }
                        lift: { type: number }
                      required: [productAId, productBId]

  /ai/assistant/ask:
    post:
      tags: [ai]
      summary: Ask the AI assistant a question about your business
      operationId: askAiAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string }
              required: [question]
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  tokensUsed: { type: integer }
                required: [answer]
