    SystemSettings:
      type: object
      properties:
        alertRetentionDays:
          type: integer
          nullable: true
          description: Admin-configured DB override (null = not set, falls through to env/default).
        effectiveAlertRetentionDays:
          type: integer
          description: Value the nightly sweep will actually use (DB > env > default).
        source:
          type: string
          enum: [db, env, default]
        envOverride:
          type: integer
          nullable: true
        defaultDays: { type: integer }
        minDays: { type: integer }
        maxDays: { type: integer }
        lastAlertSweep:
          nullable: true
          type: object
          description: Summary of the most recent nightly alerts cleanup run.
          properties:
            deleted: { type: integer }
            retentionDays: { type: integer }
            source:
              type: string
              enum: [db, env, default]
            runAt:
              type: string
              format: date-time
          required: [deleted, retentionDays, source, runAt]
        cleanupAuditKeepRuns:
          type: integer
          nullable: true
          description: Admin-configured cap on rows kept in `alerts_cleanup_runs` (null = not set, falls back to default).
        effectiveCleanupAuditKeepRuns:
          type: integer
          description: Cap the nightly sweep will actually apply when trimming `alerts_cleanup_runs`.
        cleanupAuditKeepDefault: { type: integer }
        cleanupAuditKeepMin: { type: integer }
        cleanupAuditKeepMax: { type: integer }
        cleanupReportSchedule:
          type: string
          enum: [off, weekly, monthly]
          description: Cadence on which the alerts-cleanup PDF report is emailed.
        cleanupReportRecipients:
          type: array
          items: { type: string, format: email }
          description: Email recipients for the scheduled cleanup PDF report.
        cleanupReportLastSentAt:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp of the most recent successful scheduled send.
        cleanupReportSubject:
          type: string
          nullable: true
          description: Optional admin-configured subject override for the cleanup report email.
        cleanupReportIntro:
          type: string
          nullable: true
          description: Optional admin-configured intro paragraph for the cleanup report email body.
        cleanupReportLastTestRecipient:
          type: string
          nullable: true
          description: >-
            Last one-off recipient this admin successfully sent a test cleanup
            report to. Used to pre-fill the test recipient input. Null when the
            admin has never sent a test, or explicitly cleared it by sending a
            test with no recipient (which falls back to their account email).
        cleanupReportSuppressions:
          type: array
          description: >-
            Addresses auto-quarantined after `cleanupReportSuppressionThreshold`
            consecutive bounces (no successful delivery in between). The next
            scheduled / "send now" run will silently skip these recipients.
            Admins can lift a suppression via the `unsuppressCleanupReportRecipient`
            endpoint.
          items:
            $ref: "#/components/schemas/CleanupReportSuppression"
        cleanupReportSuppressionThreshold:
          type: integer
          minimum: 2
          description: >-
            Consecutive-bounce threshold the auto-suppression sweeper uses.
            Exposed so the UI can phrase the warning ("هذا العنوان تجاوز X
            ارتداداً متتالياً") with the live config value.
        cleanupReportSuppressionMaxAgeDays:
          type: integer
          minimum: 0
          description: >-
            Task #227 — *effective* max age (in days) a suppression entry
            can live before the daily sweeper auto-expires it so the
            address can recover. Resolves the per-tenant override (Task
            #231) → env (`CLEANUP_REPORT_SUPPRESSION_MAX_AGE_DAYS`,
            default 30). `0` disables auto-expiry (every suppression
            must be lifted manually). The UI uses this to render the
            "days until auto-retry" hint next to each suppressed
            address.
        cleanupReportSuppressionMaxAgeDaysOverride:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Task #231 — the *raw* per-tenant override (or null when no
            override has been saved). Distinct from the `cleanupReportSuppressionMaxAgeDays`
            field above so the settings form can pre-fill the input
            with the saved value (or leave it empty when falling back
            to the env-derived default).
        cleanupReportSuppressionMaxAgeDaysDefault:
          type: integer
          minimum: 0
          description: >-
            Task #231 — the env-derived fallback the sweeper uses when
            no per-tenant override is set. Surfaced so the UI can show
            "uses default of N days" placeholder text on the override
            input.
        cleanupReportSuppressionMaxAgeDaysMax:
          type: integer
          minimum: 0
          description: >-
            Task #231 — hard upper bound on the override the API will
            accept (mirrors the PATCH body validation). Lets the UI
            keep its `max=` attribute in sync with the server without
            hard-coding.
        adminPrefs:
          $ref: "#/components/schemas/AdminPrefs"
      required:
        [
          alertRetentionDays,
          effectiveAlertRetentionDays,
          source,
          envOverride,
          defaultDays,
          minDays,
          maxDays,
          lastAlertSweep,
          cleanupAuditKeepRuns,
          effectiveCleanupAuditKeepRuns,
          cleanupAuditKeepDefault,
          cleanupAuditKeepMin,
          cleanupAuditKeepMax,
          cleanupReportSchedule,
          cleanupReportRecipients,
          cleanupReportLastSentAt,
          cleanupReportSubject,
          cleanupReportIntro,
          cleanupReportLastTestRecipient,
          cleanupReportSuppressions,
          cleanupReportSuppressionThreshold,
          cleanupReportSuppressionMaxAgeDays,
          cleanupReportSuppressionMaxAgeDaysOverride,
          cleanupReportSuppressionMaxAgeDaysDefault,
          cleanupReportSuppressionMaxAgeDaysMax,
          adminPrefs,
        ]

    CleanupReportSuppression:
      type: object
      description: >-
        A single auto-quarantined address. Stored on
        `app_settings.system.cleanupReport.suppressions` (jsonb). Address
        is always lower-cased.
      properties:
        email: { type: string, format: email }
        suppressedAt:
          type: string
          format: date-time
          description: ISO timestamp of when auto-suppression was applied.
        bounceCount:
          type: integer
          minimum: 0
          description: >-
            Number of consecutive bounces observed at the moment of
            suppression.
        lastReason:
          type: string
          nullable: true
          description: Bounce reason from the most recent rejected delivery row.
      required: [email, suppressedAt, bounceCount, lastReason]

    AdminPrefs:
      type: object
      description: >-
        Per-admin remembered UI state for the admin panel. Persists across
        reloads so the panel feels sticky and admins don't have to re-enter
        the same filters. Stored per-user on `users.admin_prefs`.
      properties:
        lastAdminTab:
          type: string
          nullable: true
          description: >-
            Last selected top-level tab on `/admin` (e.g. `overview`,
            `tickets`, `features`). The admin page restores this tab on
            mount when present.
        cleanupRunsFrom:
          type: string
          nullable: true
          description: >-
            Last "from" date (YYYY-MM-DD) the admin used to filter the
            alerts-cleanup runs export / count card.
        cleanupRunsTo:
          type: string
          nullable: true
          description: >-
            Last "to" date (YYYY-MM-DD) the admin used to filter the
            alerts-cleanup runs export / count card.
        insightMode:
          type: boolean
          description: >-
            Task #259 — per-user "Insight Mode" flag. When true, the UI
            reframes alerts in opportunity tone (teal). Default false.
        auditConsent:
          $ref: "#/components/schemas/AuditConsent"
      required: [lastAdminTab, cleanupRunsFrom, cleanupRunsTo]

    AuditConsent:
      type: object
      description: >-
        Per-user audit visibility consent (Task #259). When a flag is
        false, the matching facet is redacted in `/security/audit-logs`
        and `/security/audit-access` for non-owner viewers.
      properties:
        salesDetails: { type: boolean, default: true }
        customerPii: { type: boolean, default: true }
        locationContext: { type: boolean, default: true }

    TeamConsentRow:
      type: object
      description: >-
        One teammate's audit-consent snapshot (Task #260). `consent`
        always carries explicit boolean values: the server merges
        stored prefs with defaults (true / true / true) so the UI
        does not need to handle `undefined`.
      properties:
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        isActive: { type: boolean }
        consent: { $ref: "#/components/schemas/AuditConsent" }
        isDefault:
          type: boolean
          description: >-
            True when the user has never written their consent —
            every facet is still at the open default. Useful for
            owners to spot staff who left the prompt untouched.
        lastChangedAt:
          type: string
          nullable: true
        reconfirmRequestedAt:
          type: string
          nullable: true
      required: [userId, name, email, role, isActive, consent, isDefault]

    UpdateUserPreferencesRequest:
      type: object
      properties:
        preferredBranchId:
          type: integer
          nullable: true
        insightMode: { type: boolean }
        auditConsent: { $ref: "#/components/schemas/AuditConsent" }

    UserPreferencesResponse:
