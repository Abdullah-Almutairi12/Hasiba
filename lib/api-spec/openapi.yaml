      description: >-
        Returns up to the last 14 rows from `alerts_cleanup_runs` so the
        Admin Panel can render a short history (sparkline / bar chart) of
        nightly retention sweeps. Newest first. Empty array if the cron
        has not run yet.
      operationId: getAlertsCleanupHistory
      responses:
        "200":
          description: Recent sweep history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertsCleanupRun"

