        Returns the most recent row from `alerts_cleanup_runs` so the
        Admin Panel can show managers when the nightly retention sweep
        last ran, how many rows it deleted, and the retention window
        that was in effect. If the cron has not run yet, `lastRunAt`
        and `rowsDeleted` are null and `retentionDays` reflects the
