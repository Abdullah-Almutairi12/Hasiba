openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: حاسبة.AI - ERP System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard & KPIs
  - name: products
    description: Products & Inventory
  - name: pos
    description: Point of Sale
  - name: invoices
    description: Supplier Invoices
  - name: accounting
    description: Accounting & Compliance
  - name: reports
    description: Reports & Analytics
  - name: customers
    description: Customers
  - name: branches
    description: Branches
  - name: companies
    description: Multi-Company management (owner-only)
  - name: auth
    description: Authentication & session management
paths:
  /sales/sellers/workspace:
    $ref: "./seller-paths.yaml#/workspace"
  /sales/sellers/configure:
    $ref: "./seller-paths.yaml#/configure"
  /sales/sellers/eligibility:
    $ref: "./seller-paths.yaml#/eligibility"
  /sales/sellers/report:
    $ref: "./seller-paths.yaml#/report"
  /sales/invoices/{id}/attribution:
    $ref: "./seller-paths.yaml#/attribution"
  /sales/commissions/{id}/state:
    $ref: "./seller-paths.yaml#/commissionState"
  /print/profile:
    $ref: "./print-paths.yaml#/profile"
  /print/profile/logo:
    $ref: "./print-paths.yaml#/logo"
  /pos/orders/{id}/receipt.pdf:
    $ref: "./print-paths.yaml#/receipt"
  /sales/credit-notes/{id}/pdf:
    $ref: "./print-paths.yaml#/credit"
  /pos/refunds/{id}/pdf:
    $ref: "./print-paths.yaml#/refund"
  /pos/sessions/{id}/closing.pdf:
    $ref: "./print-paths.yaml#/closing"
  /sales/invoices/{id}/identity-check:
    $ref: "./print-paths.yaml#/identityCheck"
  /pos/returns/workspace:
    get:
      operationId: getReturnWorkspace
      tags: [pos]
      responses:
        "200":
          description: Live branch-scoped returns, original invoice lines and receipts, refund vouchers, shift cash summaries, access templates and policy.
          content:
            application/json:
              schema:
                type: object
                required: [notes, invoices, sessions, payouts, capabilities, branches, templates, members, policies, access]
                properties:
                  accounts:
                    type: array
                    items: { type: object, additionalProperties: true }
                  reports:
                    type: array
                    items: { type: object, additionalProperties: true }
                  notes:
                    type: array
                    items: { type: object, additionalProperties: true }
                  invoices:
                    type: array
                    items: { type: object, additionalProperties: true }
                  sessions:
                    type: array
                    items: { type: object, additionalProperties: true }
                  payouts:
                    type: array
                    items: { type: object, additionalProperties: true }
                  capabilities:
                    type: array
                    items: { type: string }
                  branches:
                    type: array
                    items: { type: object, additionalProperties: true }
                  templates:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
                  members:
                    type: array
                    items: { type: object, additionalProperties: true }
                  policies:
                    type: array
                    items: { type: object, additionalProperties: true }
                  access:
                    type: array
                    items: { type: object, additionalProperties: true }
  /pos/returns/actions:
    post:
      operationId: returnAction
      tags: [pos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, payload]
              properties:
                action:
                  type: string
                  enum: [request, approve, payout, confirm_external, cancel_payout, close, approve_close, expense, export, configure_access, configure_policy]
                payload:
                  type: object
                  description: Validated per action. Request uses invoiceId/customerId/warehouseId/lines/reason/disposition/settlementMethod/proofRef; payout uses noteId/receiptId/sessionId/amount/method/reference/delivered/idempotencyKey; close uses sessionId/counted/reason/unresolvedSalesCleared; configure_access uses userId/template/capabilities/branches; configure_policy uses branchId/approvalAbove/allowResale.
                  additionalProperties: true
      responses:
        "200":
          description: Recorded action result. Noncash requested is not a completed refund.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "201":
          description: Created return or voucher.
        "202":
          description: Awaiting approval.
        "400":
          description: Invalid action or missing cash handover confirmation.
        "403":
          description: Current membership, branch or capability does not authorize action.
        "409":
          description: Insufficient entitlement, closed shift, pending actions or changed approved facts.
  /inventory/revaluations:
    get:
      operationId: listInventoryRevaluations
      tags: [Inventory]
      responses:
        "200":
          description: Immutable valuation evidence and pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryRevaluation"
    post:
      operationId: previewInventoryRevaluation
      tags: [Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryRevaluationInput"
      responses:
        "201":
          description: Persisted preview; no inventory or accounting writes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRevaluation"
  /inventory/revaluations/{id}/{action}:
    post:
      operationId: transitionInventoryRevaluation
      tags: [Inventory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [confirm, approve, cancel] } }
      responses:
        "200":
          description: Confirmed, posted or cancelled request; repeated transitions are idempotent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRevaluation"
  /inventory/revaluation-balances:
    get:
      operationId: listRevaluationBalances
      tags: [Inventory]
      responses:
        "200":
          description: Standard-cost stock available to revalue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevaluationBalance"
  /inventory/revaluation-accounts:
    get:
      operationId: listRevaluationAccounts
      tags: [Inventory]
      responses:
        "200":
          description: Eligible variance accounts; selection requires financial approval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevaluationAccount"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Dashboard
  /dashboard/manager-bar:
    get:
      operationId: getManagerKpiBar
      tags: [dashboard]
      summary: Compact KPI snapshot for the sticky manager bar (manager/owner only)
      responses:
        "200":
          description: Manager KPI bar metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerKpiBar"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPIs and summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/sales-chart:
    get:
      operationId: getDashboardSalesChart
      tags: [dashboard]
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [weekly, monthly, yearly]
            default: weekly
      summary: Get sales chart data
      responses:
        "200":
          description: Sales chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesChartPoint"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Get AI alerts
      responses:
        "200":
          description: AI alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/alerts/dismiss:
    post:
      operationId: dismissDashboardAlert
      tags: [dashboard]
      summary: Dismiss a dashboard alert for the current user
      description: >
        Persists a per-user dismissal of a dashboard alert by its stable
        `key`. Dismissed alerts disappear from `GET /dashboard/alerts`
        for that user until the underlying condition re-triggers
        (i.e. its `triggeredAt` advances past the dismissal time). Safe
        to call repeatedly; later calls refresh the dismissedAt
        timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: The alert's stable `key` as returned by GET /dashboard/alerts.
                justificationNotes:
                  type: string
                  maxLength: 2000
                  description: >
                    Free-text justification an accountant supplies when
                    hiding the alert. Persisted on the dismissal row so
                    external auditors can trace WHY a row was silenced.
                attachmentUrl:
                  type: string
                  maxLength: 512
                  description: >
                    Relative URL of a supporting PDF (e.g. supplier
                    invoice, bank advice) uploaded via POST
                    /storage/attachments. Must live under
                    /api/storage/objects/attachments/ and end in .pdf.
              required: [key]
      responses:
        "200":
          description: Dismissal recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /dashboard/alerts/dismissed:
    get:
      operationId: listDismissedDashboardAlerts
      tags: [dashboard]
      summary: List dashboard alerts the current user has dismissed
      description: >
        Returns the dismissal rows for the signed-in user within the
        active company, enriched with the original alert metadata
        (title/message/type) when the underlying alert still exists.
        Synthetic banners (e.g. `synthetic:stale_scan`) carry a static
        label so finance can recognise what was hidden.
      responses:
        "200":
          description: Dismissed alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DismissedAlert"
    delete:
      operationId: undismissDashboardAlert
      tags: [dashboard]
      summary: Un-dismiss a dashboard alert for the current user
      description: >
        Removes the per-user dismissal row identified by `key` so the
        alert reappears on the next refresh (if the underlying
        condition still holds). Returns `{ok:true}` regardless of
        whether a row was deleted (idempotent).
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: The alert's stable `key` as returned by GET /dashboard/alerts.
      responses:
        "200":
          description: Dismissal removed (or already absent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /dashboard/branch-performance:
    get:
      operationId: getBranchPerformance
      tags: [dashboard]
      summary: Get branch comparison data
      responses:
        "200":
          description: Branch performance list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchPerformance"

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products/categories:
    get:
      operationId: listProductCategories
      tags: [products]
      summary: List product categories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /products/stats:
    get:
      operationId: getProductStats
      tags: [products]
      summary: Get product & inventory stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStats"

  # POS
  /pos/sessions:
    get:
      operationId: listPosSessions
      tags: [pos]
      summary: List POS sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosSession"
    post:
      operationId: createPosSession
      tags: [pos]
      summary: Open new POS session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSession"

  /pos/orders:
    get:
      operationId: listPosOrders
      tags: [pos]
      summary: List POS orders
      parameters:
        - name: sessionId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosOrder"
    post:
      operationId: createPosOrder
      tags: [pos]
      summary: Create POS order / sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOrder"

  /pos/orders/{id}:
    get:
      operationId: getPosOrder
      tags: [pos]
      summary: Get a single POS order with its split-payment breakdown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOrder"
        "400":
          description: Invalid order id
        "404":
          description: Not found

  /pos/summary:
    get:
      operationId: getPosSummary
      tags: [pos]
      summary: Get POS daily summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSummary"

  # Supplier Invoices
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List supplier invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, done, failed, needs_review]
      responses:
        "200":
          description: Invoices list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a supplier invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/stats:
    get:
      operationId: getInvoiceStats
      tags: [invoices]
      summary: Get invoice processing stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceStats"

  # Accounting
  /accounting/journal-entries:
    get:
      operationId: listJournalEntries
      tags: [accounting]
      summary: List journal entries
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: accountId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [accounting]
      summary: Create journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  entryNumber: { type: string }
                required: [id, entryNumber]

  /accounting/journal-entries/{id}:
    get:
      operationId: getJournalEntry
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Journal entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryDetail"

  /accounting/journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string }
                required: [id, status]

  /accounting/journal-entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Reversed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  entryNumber: { type: string }
                required: [id, entryNumber]

  /accounting/accounts:
    get:
      operationId: listAccounts
      tags: [accounting]
      summary: List chart of accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: createAccount
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /accounting/accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /accounting/currencies:
    get:
      operationId: listCurrencies
      tags: [accounting]
      responses:
        "200":
          description: Currencies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Currency" }

  /accounting/exchange-rates:
    get:
      operationId: listExchangeRates
      tags: [accounting]
      responses:
        "200":
          description: Exchange rates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExchangeRate" }
    post:
      operationId: createExchangeRate
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExchangeRateBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeRate" }

  /accounting/fiscal-years:
    get:
      operationId: listFiscalYears
      tags: [accounting]
      responses:
        "200":
          description: Fiscal years with periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FiscalYear" }

  /accounting/fiscal-periods/{id}/close:
    post:
      operationId: closeFiscalPeriod
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Period closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalPeriod" }

  /accounting/fiscal-periods/{id}/reopen:
    post:
      operationId: reopenFiscalPeriod
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Period reopened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalPeriod" }

  /accounting/periods/{id}/close:
    post:
      operationId: closeFiscalPeriodAlias
      tags: [accounting]
      summary: Close a fiscal period (alias matching task spec)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Period closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalPeriod" }

  /accounting/periods/{id}/reopen:
    post:
      operationId: reopenFiscalPeriodAlias
      tags: [accounting]
      summary: Reopen a closed fiscal period (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Period reopened
          content:
