              type: object
              properties:
                alertRetentionDays:
                  type: integer
                  nullable: true
                  minimum: 7
                  maximum: 3650
                  description: Null clears the DB override and falls back to env/default.
                cleanupAuditKeepRuns:
                  type: integer
                  nullable: true
                  minimum: 30
                  maximum: 3650
                  description: Cap on rows kept in `alerts_cleanup_runs`. Null clears the override and falls back to the default (365).
                cleanupReportSchedule:
                  type: string
                  enum: [off, weekly, monthly]
                  description: Cadence on which the alerts-cleanup PDF report is emailed.
                cleanupReportRecipients:
                  type: array
                  items: { type: string, format: email }
                  maxItems: 50
                  description: Email recipients for the scheduled cleanup PDF report.
                cleanupReportSubject:
                  type: string
                  nullable: true
                  maxLength: 200
                  description: >-
                    Optional override for the cleanup report email subject.
                    Supports tokens `{period}`, `{from}`, `{to}`. Empty/null
                    clears the override and falls back to the default subject.
                cleanupReportIntro:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: >-
                    Optional intro paragraph prepended to the cleanup report
                    email body. Empty/null falls back to the default intro.
                cleanupReportSuppressionMaxAgeDays:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 365
                  description: >-
                    Task #231 — per-tenant override for how long an auto-
                    suppression entry lives before the daily sweeper
                    auto-expires it. `null` clears the override and falls
                    back to the env-derived default
                    (`CLEANUP_REPORT_SUPPRESSION_MAX_AGE_DAYS`, default 30).
                    `0` disables auto-expiry (every suppression must be
                    lifted manually). Upper bound is 365 days.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  alertRetentionDays: { type: integer, nullable: true }
                  cleanupAuditKeepRuns: { type: integer, nullable: true }
                  cleanupReportSchedule:
                    type: string
                    enum: [off, weekly, monthly]
                  cleanupReportRecipients:
                    type: array
                    items: { type: string }
                  cleanupReportSubject:
                    type: string
                    nullable: true
                  cleanupReportIntro:
                    type: string
                    nullable: true
                  cleanupReportSuppressionMaxAgeDaysOverride:
                    type: integer
                    nullable: true
                    description: >-
                      Echoes back the saved per-tenant override (null = no
                      override → effective value falls back to env/default).
                  cleanupReportSuppressionMaxAgeDays:
                    type: integer
                    minimum: 0
                    description: >-
                      Effective value the sweeper will use after the update
                      (override → env → default).
                required: [ok]

  /admin/me/prefs:
    patch:
      tags: [admin]
      summary: Update the current admin's remembered panel preferences
      description: >-
        Persists per-admin UI state for `/admin` (selected tab, cleanup
        runs date filter, ...) so the panel feels sticky across reloads.
        Stored on `users.admin_prefs`. Pass `null` for any field to clear
        it. Omitted fields are left unchanged.
      operationId: updateAdminPrefs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lastAdminTab:
                  type: string
                  nullable: true
                  maxLength: 64
                cleanupRunsFrom:
                  type: string
                  nullable: true
                  description: ISO date (YYYY-MM-DD) or null to clear.
                cleanupRunsTo:
                  type: string
                  nullable: true
                  description: ISO date (YYYY-MM-DD) or null to clear.
      responses:
        "200":
          description: Updated prefs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  adminPrefs:
                    $ref: "#/components/schemas/AdminPrefs"
                required: [ok, adminPrefs]

  /admin/system-settings/cleanup-report-preview:
    get:
      tags: [admin]
      summary: Preview the resolved cleanup report email subject + body (admin only)
      description: >-
        Renders the email subject and body exactly as the next scheduled
        (or manual) send would produce them, given the current draft
        text. Uses the same window the schedule would use (7 or 30 days)
        and the same compliance counts / cleanup-run count from the live
        database, so admins can iterate on wording without spamming
        auditors. Pass `subject` / `intro` to preview unsaved drafts;
        omit them to preview the currently stored values.
      operationId: getCleanupReportPreview
      parameters:
        - in: query
          name: subject
          required: false
          schema: { type: string, maxLength: 200 }
        - in: query
          name: intro
          required: false
          schema: { type: string, maxLength: 2000 }
        - in: query
          name: schedule
          required: false
          schema:
            type: string
            enum: [off, weekly, monthly]
      responses:
        "200":
          description: Rendered email preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  body: { type: string }
                  periodLabel: { type: string }
                  from: { type: string }
                  to: { type: string }
                  rowCount: { type: integer }
                  complianceAlertCount: { type: integer }
                  schedule:
                    type: string
                    enum: [off, weekly, monthly]
                required:
                  [
                    subject,
                    body,
                    periodLabel,
                    from,
                    to,
                    rowCount,
                    complianceAlertCount,
                    schedule,
                  ]

  /admin/system-settings/send-cleanup-report-now:
    post:
      tags: [admin]
      summary: Send the alerts-cleanup PDF report email immediately (admin only)
      description: >-
        Bypasses the configured weekly/monthly cadence and emails the
        PDF report to the currently configured recipients right now.
        Used to verify a new recipient list or SMTP configuration.
      operationId: sendCleanupReportNow
      responses:
        "200":
          description: Report sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sent: { type: boolean }
                  recipients:
                    type: array
                    items: { type: string }
                  rowCount: { type: integer }
                required: [ok, sent]
        "400":
          description: No recipients / mailer not configured / other precondition
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason: { type: string }
                required: [error]

  /admin/system-settings/send-cleanup-report-test:
    post:
      tags: [admin]
      summary: Send a one-off test cleanup report email to a single recipient (admin only)
      description: >-
        Renders and emails the same PDF / subject / body the next
        scheduled tick would send, but to a single one-off recipient.
        Lets admins validate SMTP, attachments and formatting in
        their actual mail client before going live. Does NOT touch
        `lastSentAt`, does NOT modify the saved recipient list, and
        bypasses the recipients-empty precondition / schedule cadence.
        Subject is prefixed with `[TEST]`. When `recipient` is
        omitted or empty, defaults to the currently logged-in admin's
        account email so they can quickly "send to me".
      operationId: sendCleanupReportTest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  format: email
                  description: >-
                    Optional one-off email to send the test to. When
                    omitted or empty, defaults to the current admin's
                    account email.
      responses:
        "200":
          description: Test report sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sent: { type: boolean }
                  recipient: { type: string }
                  rowCount: { type: integer }
                required: [ok, sent, recipient]
        "400":
          description: Invalid recipient / mailer not configured / other precondition
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason: { type: string }
                required: [error]

  /admin/system-settings/cleanup-report-suppressions/unsuppress:
    post:
      tags: [admin]
      summary: Lift an auto-suppression for a single cleanup-report recipient (admin only)
      description: >-
        Removes the given address from `app_settings.system.cleanupReport.suppressions`.
        Use this once the underlying delivery problem (typo, full mailbox,
        retired auditor address, ...) has been resolved so the next scheduled
        send actually attempts delivery to the address again. Idempotent at
        the data layer but returns 404 when the address isn't currently
        suppressed so admins get clear feedback.
      operationId: unsuppressCleanupReportRecipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        "200":
          description: Suppression lifted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  email: { type: string }
                required: [ok, email]
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason: { type: string }
                required: [error]
        "404":
          description: Address is not currently suppressed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason: { type: string }
                required: [error]

  /admin/system-settings/cleanup-report-suppression-expiries:
    get:
      tags: [admin]
      summary: List recently auto-expired cleanup-report suppressions (admin only)
      description: >-
        Task #232 — returns the suppression entries that the daily
        sweeper (`sweepExpiredCleanupReportSuppressions`) lifted
        automatically because they had been on the quarantine list
        longer than `CLEANUP_REPORT_SUPPRESSION_MAX_AGE_DAYS`. Filter
        by `from` / `to` (inclusive bounds on `expiredAt`) when
        investigating a specific window — e.g. "did the sweeper
        re-enable this auditor's address in the last week?".
      operationId: listCleanupReportSuppressionExpiries
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Lower bound (inclusive) on `expiredAt`.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Upper bound (inclusive) on `expiredAt`.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
          description: Max rows to return. Defaults to 50.
      responses:
        "200":
          description: Recently auto-expired suppressions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    email: { type: string }
                    suppressedAt:
                      type: string
                      format: date-time
                      nullable: true
                      description: When the address was originally auto-suppressed.
                    lastReason:
                      type: string
                      nullable: true
                      description: Bounce reason that originally triggered the suppression.
                    bounceCount: { type: integer }
                    expiredAt:
                      type: string
                      format: date-time
                      description: When the daily sweeper expired the suppression.
                    maxAgeDays:
                      type: integer
                      description: >-
                        Snapshot of `CLEANUP_REPORT_SUPPRESSION_MAX_AGE_DAYS`
                        at sweep time.
                    subsequentDeliveryCount:
                      type: integer
                      description: >-
                        Task #236 — number of successful cleanup-report
                        deliveries this address has received SINCE the
                        sweeper auto-expired its suppression. `0` means
                        the recovered address has not yet been proven
                        deliverable.
                    lastSubsequentDeliveryAt:
                      type: string
                      format: date-time
                      nullable: true
                      description: >-
                        Task #236 — timestamp of the most recent
                        successful delivery after `expiredAt`, or null
                        if none has happened yet.
                  required:
                    - id
                    - email
                    - bounceCount
                    - expiredAt
                    - maxAgeDays
                    - subsequentDeliveryCount
                    - lastSubsequentDeliveryAt
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason: { type: string }
                required: [error]

  /admin/system-settings/cleanup-report-sends/{id}/resend:
    post:
      tags: [admin]
      summary: Re-send a past cleanup-report email to its original recipients (admin only)
      description: >-
        Re-emails the cleanup PDF to the recipients of a specific
        historical send (by id). Only successful past sends can be
        re-sent. The new attempt is logged as its own row in the send
        history with `trigger="manual"`. Does NOT bump the schedule's
        `lastSentAt`, so the next scheduled cron tick still fires on
        its normal cadence.
      operationId: resendCleanupReport
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >-
                Optional subset selector (task #201) and additional
                recipients list (task #210). When `recipients` is
                omitted or empty the email goes to every recipient of
                the original send (legacy behaviour). When provided,
                the email goes only to those addresses, which must all
                be present in the original send's recipient list.
                `additionalRecipients` (task #210) is a separate
                channel for forwarding the same historical PDF to
                addresses that were NOT in the original recipient
                list — e.g. a new hire who joined after the report
                ran. They are added on top of the resolved
                recipients/originals list, validated as emails, and
                audited distinctly.
              properties:
                recipients:
                  type: array
                  maxItems: 50
                  items: { type: string }
                additionalRecipients:
                  type: array
                  maxItems: 50
                  items: { type: string, format: email }
      responses:
        "200":
          description: Report re-sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sent: { type: boolean }
                  recipients:
                    type: array
                    items: { type: string }
                  rowCount: { type: integer }
                  subset:
                    type: boolean
                    description: >-
                      True when the send went to a strict subset of the
                      original recipients (task #201).
                  additional:
                    type: integer
                    description: >-
                      Count of recipients that were NOT in the original
                      recipient list (task #210) — i.e. the size of the
                      `additionalRecipients` add-on after deduping
                      against the original list.
                required: [ok, sent]
        "400":
          description: Invalid id / not a success row / mailer not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  reason: { type: string }
                required: [error]
        "404":
          description: Send history row not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]

  /admin/system-settings/cleanup-report-sends:
    get:
      tags: [admin]
      summary: List the most recent cleanup-report email send attempts (admin only)
      description: >-
        Returns the last ~20 cleanup-report email sends (scheduled cron,
        manual "send now", and admin test sends) so admins can audit
        who triggered each send, what kind it was, how many recipients
        it reached and whether it succeeded (or why it failed).
      operationId: listCleanupReportSends
      responses:
        "200":
          description: Recent send attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    sentAt: { type: string, format: date-time }
                    trigger:
                      type: string
                      enum: [cron, manual, test]
                    triggeredByUserId:
                      type: integer
                      nullable: true
                    triggeredByUserName:
                      type: string
                      nullable: true
                    recipientCount: { type: integer }
                    recipients: { type: string }
                    rowCount:
                      type: integer
                      nullable: true
                    status:
                      type: string
                      enum: [success, failure]
                    failureReason:
                      type: string
                      nullable: true
                    windowFrom:
                      type: string
                      format: date-time
                      nullable: true
                      description: >-
                        Start of the report window the PDF covered.
                        Nullable for rows written before task #196 and
                        for early-failure rows where the PDF wasn't
                        built.
                    windowTo:
                      type: string
                      format: date-time
                      nullable: true
                      description: End of the report window the PDF covered.
                    messageId:
                      type: string
                      nullable: true
                      description: >-
                        Task #204 — SMTP message-id returned by the
                        underlying transport. Used by the email
                        delivery webhook to correlate async bounce /
                        delivery events back to this send.
                    recipientStatuses:
                      type: array
                      description: >-
                        Task #204 — per-recipient delivery status.
                        One entry per address in `recipients`. Empty
                        array for failed sends and for historical
                        rows written before this column existed.
                      items:
                        type: object
                        properties:
                          email: { type: string }
                          status:
                            type: string
                            enum: [delivered, bounced, pending, deferred]
                          reason:
                            type: string
                            nullable: true
                          deliveredAt:
                            type: string
                            format: date-time
                            nullable: true
                          updatedAt:
                            type: string
                            format: date-time
                        required: [email, status, updatedAt]
                  required:
                    - id
                    - sentAt
                    - trigger
                    - recipientCount
                    - recipients
                    - status

  /admin/system-settings/cleanup-report-test-history:
    get:
      tags: [admin]
      summary: Recent cleanup report test send history (admin only)
      description: >-
        Returns the last 5 `system_settings.cleanup_report_sent_test`
        audit log entries so admins can see at a glance who recently
        dry-ran the cleanup report and to which inbox.
      operationId: getCleanupReportTestHistory
      responses:
        "200":
          description: Recent test sends
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        userName: { type: string }
                        recipient: { type: string, nullable: true }
                        rowCount: { type: integer, nullable: true }
                        createdAt: { type: string, format: date-time }
                      required: [id, userName, createdAt]
                required: [entries]

