openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: حاسبة.AI - ERP System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard & KPIs
  - name: products
    description: Products & Inventory
  - name: pos
    description: Point of Sale
  - name: invoices
    description: Supplier Invoices
  - name: accounting
    description: Accounting & Compliance
  - name: reports
    description: Reports & Analytics
  - name: customers
    description: Customers
  - name: branches
    description: Branches
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPIs and summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/sales-chart:
    get:
      operationId: getDashboardSalesChart
      tags: [dashboard]
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [weekly, monthly, yearly]
            default: weekly
      summary: Get sales chart data
      responses:
        "200":
          description: Sales chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesChartPoint"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Get AI alerts
      responses:
        "200":
          description: AI alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/branch-performance:
    get:
      operationId: getBranchPerformance
      tags: [dashboard]
      summary: Get branch comparison data
      responses:
        "200":
          description: Branch performance list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchPerformance"

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products/categories:
    get:
      operationId: listProductCategories
      tags: [products]
      summary: List product categories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /products/stats:
    get:
      operationId: getProductStats
      tags: [products]
      summary: Get product & inventory stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStats"

  # POS
  /pos/sessions:
    get:
      operationId: listPosSessions
      tags: [pos]
      summary: List POS sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosSession"
    post:
      operationId: createPosSession
      tags: [pos]
      summary: Open new POS session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSession"

  /pos/orders:
    get:
      operationId: listPosOrders
      tags: [pos]
      summary: List POS orders
      parameters:
        - name: sessionId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosOrder"
    post:
      operationId: createPosOrder
      tags: [pos]
      summary: Create POS order / sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOrder"

  /pos/orders/{id}:
    get:
      operationId: getPosOrder
      tags: [pos]
      summary: Get a single POS order with its split-payment breakdown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOrder"
        "400":
          description: Invalid order id
        "404":
          description: Not found

  /pos/summary:
    get:
      operationId: getPosSummary
      tags: [pos]
      summary: Get POS daily summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSummary"

  # Supplier Invoices
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List supplier invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, done, failed, needs_review]
      responses:
        "200":
          description: Invoices list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a supplier invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/stats:
    get:
      operationId: getInvoiceStats
      tags: [invoices]
      summary: Get invoice processing stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceStats"

  # Accounting
  /accounting/journal-entries:
    get:
      operationId: listJournalEntries
      tags: [accounting]
      summary: List journal entries
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: accountId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [accounting]
      summary: Create journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  entryNumber: { type: string }
                required: [id, entryNumber]

  /accounting/journal-entries/{id}:
    get:
      operationId: getJournalEntry
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Journal entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryDetail"

  /accounting/journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string }
                required: [id, status]

  /accounting/journal-entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Reversed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  entryNumber: { type: string }
                required: [id, entryNumber]

  /accounting/accounts:
    get:
      operationId: listAccounts
      tags: [accounting]
      summary: List chart of accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: createAccount
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /accounting/accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /accounting/currencies:
    get:
      operationId: listCurrencies
      tags: [accounting]
      responses:
        "200":
          description: Currencies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Currency" }

  /accounting/exchange-rates:
    get:
      operationId: listExchangeRates
      tags: [accounting]
      responses:
        "200":
          description: Exchange rates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExchangeRate" }
    post:
      operationId: createExchangeRate
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExchangeRateBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeRate" }

  /accounting/fiscal-years:
    get:
      operationId: listFiscalYears
      tags: [accounting]
      responses:
        "200":
          description: Fiscal years with periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FiscalYear" }

  /accounting/fiscal-periods/{id}/close:
    post:
      operationId: closeFiscalPeriod
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Period closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalPeriod" }

  /accounting/fiscal-periods/{id}/reopen:
    post:
      operationId: reopenFiscalPeriod
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Period reopened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiscalPeriod" }

  /accounting/bank-accounts:
    get:
      operationId: listBankAccounts
      tags: [accounting]
      responses:
        "200":
          description: Bank accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankAccount" }
    post:
      operationId: createBankAccount
      tags: [accounting]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBankAccountBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }

  /accounting/bank-statements:
    post:
      operationId: importBankStatement
      tags: [accounting]
      summary: Import a bank statement (CSV-parsed lines from the client)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportBankStatementBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankStatement" }

  /accounting/bank-statements/{id}/reconciliation:
    get:
      operationId: getBankReconciliation
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Statement with lines and matchable journal entry candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankReconciliationView" }

  /accounting/bank-statement-lines/{id}/match:
    post:
      operationId: matchBankStatementLine
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchedLineId]
              properties:
                matchedLineId: { type: integer }
      responses:
        "200":
          description: Matched bank statement line
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankStatementLine" }

  /reports/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [reports]
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalance" }

  /reports/profit-loss:
    get:
      operationId: getProfitLoss
      tags: [reports]
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Profit and loss
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfitLoss" }

  /reports/balance-sheet:
    get:
      operationId: getBalanceSheet
      tags: [reports]
      parameters:
        - name: asOf
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Balance sheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceSheet" }

  /reports/cash-flow:
    get:
      operationId: getCashFlow
      tags: [reports]
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Cash flow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashFlow" }

  /reports/general-ledger/{accountId}:
    get:
      operationId: getGeneralLedger
      tags: [reports]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: General ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralLedger" }

  /accounting/summary:
    get:
      operationId: getAccountingSummary
      tags: [accounting]
      summary: Get accounting KPIs (cash flow, receivables, payables)
      responses:
        "200":
          description: Accounting summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingSummary"

  /accounting/zatca-status:
    get:
      operationId: getZatcaStatus
      tags: [accounting]
      summary: Get ZATCA compliance status
      responses:
        "200":
          description: ZATCA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZatcaStatus"

  # Reports
  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [reports]
      summary: Get sales analytics report
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly]
            default: monthly
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"

  /reports/ai-summary:
    get:
      operationId: getAiReportSummary
      tags: [reports]
      summary: Get AI-generated daily report summary
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReportSummary"

  /reports/top-products:
    get:
      operationId: getTopProducts
      tags: [reports]
      summary: Get top selling products
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProduct"

  /reports/insights:
    get:
      operationId: getReportInsights
      tags: [reports]
      summary: Get AI-powered insights, anomalies, and benchmarks
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportInsights"

  /reports/fraud-detection:
    get:
      operationId: getFraudDetection
      tags: [reports]
      summary: Get suspicious transactions detected by AI
      responses:
        "200":
          description: Fraud alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FraudAlert"

  # Customers
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  # Branches
  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List branches
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"

  /warehouses:
    get:
      operationId: listWarehouses
      tags: [warehouses]
      summary: List warehouses
      parameters:
        - in: query
          name: branchId
          schema:
            type: integer
      responses:
        "200":
          description: Warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"
    post:
      operationId: createWarehouse
      tags: [warehouses]
      summary: Create a warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarehouseBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/roles:
    get:
      operationId: listRoles
      tags: [users]
      summary: List role templates with permissions
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /security/checklist:
