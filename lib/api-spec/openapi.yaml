components:
  schemas:
    ApprovalStep:
      type: object
      properties:
        id: { type: integer }
        ruleId: { type: integer }
        sequence: { type: integer }
        approverRole: { type: string }
        approverUserId: { type: integer, nullable: true }
        minAmount: { type: number }
      required: [sequence, approverRole, minAmount]
    ApprovalRule:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        docType: { type: string }
        branchId: { type: integer, nullable: true }
        minAmount: { type: number }
        maxAmount: { type: number, nullable: true }
        mode: { type: string, enum: [sequential, parallel] }
        isActive: { type: boolean }
        createdAt: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/ApprovalStep" } }
      required: [id, name, docType, minAmount, mode, isActive, createdAt, steps]
    ApprovalRuleInput:
      type: object
      properties:
        name: { type: string }
        docType: { type: string }
        branchId: { type: integer, nullable: true }
        minAmount: { type: number }
        maxAmount: { type: number, nullable: true }
        mode: { type: string, enum: [sequential, parallel] }
        isActive: { type: boolean }
        steps:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              approverRole: { type: string }
              approverUserId: { type: integer, nullable: true }
              minAmount: { type: number }
            required: [sequence, approverRole, minAmount]
      required: [name, docType, steps]
    ApprovalRulePatch:
      type: object
      description: Partial update payload for an approval rule. All fields optional.
      properties:
        name: { type: string }
        docType: { type: string }
        branchId: { type: integer, nullable: true }
        minAmount: { type: number }
        maxAmount: { type: number, nullable: true }
        mode: { type: string, enum: [sequential, parallel] }
        isActive: { type: boolean }
        steps:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              approverRole: { type: string }
              approverUserId: { type: integer, nullable: true }
              minAmount: { type: number }
            required: [sequence, approverRole, minAmount]
    ApprovalRequest:
      type: object
      properties:
        id: { type: integer }
        ruleId: { type: integer, nullable: true }
        docType: { type: string }
        recordId: { type: integer }
        recordRef: { type: string, nullable: true }
        branchId: { type: integer, nullable: true }
        amount: { type: number }
        submittedByUserId: { type: integer, nullable: true }
        submittedByName: { type: string, nullable: true }
        status: { type: string }
        currentStep: { type: integer }
        notes: { type: string, nullable: true }
        createdAt: { type: string }
        decidedAt: { type: string, nullable: true }
      required: [id, docType, recordId, amount, status, currentStep, createdAt]
    ApprovalAction:
      type: object
      properties:
        id: { type: integer }
        requestId: { type: integer }
        stepSequence: { type: integer }
        approverUserId: { type: integer, nullable: true }
        approverName: { type: string, nullable: true }
        action: { type: string }
        comment: { type: string, nullable: true }
        actedAt: { type: string }
      required: [id, requestId, stepSequence, action, actedAt]
    ApprovalRequestDetail:
      allOf:
        - $ref: "#/components/schemas/ApprovalRequest"
        - type: object
          properties:
            steps: { type: array, items: { $ref: "#/components/schemas/ApprovalStep" } }
            actions: { type: array, items: { $ref: "#/components/schemas/ApprovalAction" } }
          required: [steps, actions]
    ApproverDelegation:
      type: object
      properties:
        id: { type: integer }
        fromUserId: { type: integer }
        toUserId: { type: integer }
        fromDate: { type: string }
        toDate: { type: string }
        reason: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, fromUserId, toUserId, fromDate, toDate, createdAt]
    FinancialLimit:
      type: object
      properties:
        id: { type: integer }
        role: { type: string }
        actionKey: { type: string }
        maxValue: { type: number, nullable: true }
        description: { type: string, nullable: true }
        updatedAt: { type: string }
      required: [id, role, actionKey, updatedAt]
    AutomationRule:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
