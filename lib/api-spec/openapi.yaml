  # ============================================================
  # Multi-Company (Phase 3) — owner-only company management
  # ============================================================
  /admin/companies:
    get:
      tags: [companies]
      operationId: listCompanies
      summary: List only companies explicitly owned by the caller
      responses:
        "200":
          description: list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Company" }
    post:
      tags: [companies]
      operationId: createCompany
      summary: Create a new tenant (owner-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCompanyRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }

  /admin/companies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [companies]
      operationId: updateCompany
      summary: Partially update a tenant (owner-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCompanyRequest" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
    delete:
      tags: [companies]
      operationId: deleteCompany
      summary: Soft-delete a tenant (owner-only)
      responses:
        "204": { description: deleted }
        "409":
          description: conflict (last company or has active data)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyDeleteError" }

  /admin/companies/{id}/users:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [companies]
      operationId: listCompanyUsers
      summary: List users with access to the tenant
      responses:
        "200":
          description: list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyUser" }
    post:
      tags: [companies]
      operationId: assignCompanyUser
      summary: Grant or update a user's access + role for the tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignUserRequest" }
      responses:
        "201":
          description: assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCompany" }

  /admin/companies/{id}/users/{userId}:
    parameters:
      - { name: id,     in: path, required: true, schema: { type: integer } }
      - { name: userId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [companies]
      operationId: revokeCompanyUser
      summary: Remove a user's access to the tenant
      responses:
        "204": { description: removed }

  /auth/switch-company:
    post:
      tags: [auth]
      operationId: switchCompany
      summary: Switch the active tenant on the session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchCompanyRequest" }
      responses:
        "200":
          description: switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  companyId: { type: integer }
                  role: { type: string }
                required: [companyId, role]

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Return the authenticated user plus their company memberships
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }

  /storage/attachments:
    post:
      tags: [storage]
      operationId: uploadStorageAttachment
      summary: Upload a PDF attachment (audit-trail supporting document)
      description: >
        Accepts a base64-encoded PDF and stores it under the private
        object-storage namespace. Returns the relative URL the caller
        should persist on the owning record (e.g. an alert dismissal's
        `attachmentUrl`). Max file size 10MB, must start with the PDF
        magic bytes (%PDF).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: Original file name; must end in .pdf.
                contentBase64:
                  type: string
                  description: Base64 encoding of the raw PDF bytes.
              required: [filename, contentBase64]
      responses:
        "200":
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Relative URL under /api/storage/objects/attachments/...
                  filename:
                    type: string
                required: [url, filename]

  # ============================================================
  # ZATCA SMB compliance — VAT registration + threshold counter
  # ============================================================
  /vat/status:
    get:
      tags: [companies]
      operationId: getVatStatus
      summary: Current tenant's VAT registration + rolling 12m threshold snapshot
      responses:
        "200":
          description: snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatStatusResponse" }

  /vat/registration:
    patch:
      tags: [companies]
      operationId: updateVatRegistration
      summary: Update the current tenant's VAT registration status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVatRegistrationRequest" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  vatRegistrationStatus: { type: string }
                  vatNumber: { type: string, nullable: true }
                  vatRegistrationDate: { type: string, nullable: true }
                required: [id, vatRegistrationStatus]

  /vat/return:
    get:
      tags: [companies]
      operationId: getVatReturn
      summary: Quarterly VAT return (JSON or PDF) for the current tenant
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer }
        - in: query
          name: quarter
          required: true
          schema: { type: integer, minimum: 1, maximum: 4 }
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [json, pdf], default: json }
        - in: query
          name: lang
          required: false
          description: PDF label language. Company-wide report, using Asia/Riyadh quarter boundaries.
          schema: { type: string, enum: [ar, en], default: ar }
      responses:
        "200":
          description: VAT return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatReturnResponse" }
            application/pdf:
              schema: { type: string, format: binary }

  /vat/simulate:
    post:
      tags: [companies]
      operationId: simulateVatTrajectory
      summary: What-if projection of rolling-12m sales against VAT thresholds
      description: >-
        Task #259 — pure compute on top of the same rolling-12m engine
        the dashboard counter uses. Defaults `baselineRolling12mSales`
        to the live tenant value; clients can override for hypothetical
        scenarios. Returns the projected trajectory plus the month at
        which the voluntary / mandatory line will be crossed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                baselineRolling12mSales: { type: number, minimum: 0 }
                monthlyGrowthRate: { type: number, minimum: -0.5, maximum: 2 }
                months: { type: integer, minimum: 1, maximum: 36 }
                oneOffBoost: { type: number, minimum: 0 }
                cashImpactRate: { type: number, minimum: 0, maximum: 1 }
                voluntaryRegistrationChoice: { type: boolean }
                priceChangePct: { type: number, minimum: -0.5, maximum: 2 }
      responses:
        "200":
          description: simulation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatSimulationResult" }

  /vat/threshold/check:
    post:
      tags: [companies]
      operationId: runVatThresholdCheck
      summary: Manually sweep the rolling 12m threshold and emit alerts if crossed
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: { $ref: "#/components/schemas/VatStatusResponse" }
                  alertEmitted:
                    type: string
                    nullable: true
                    enum: [near80, mandatory]
                required: [snapshot]

components:
  schemas:
    InventoryRevaluationInput:
      type: object
      required: [quantId, varianceAccountId, reason]
      properties:
        quantId: { type: integer, minimum: 1 }
        varianceAccountId: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    RevaluationAccount:
      type: object
      required: [id, code, nameAr]
      properties:
        id: { type: integer }
        code: { type: string }
        nameAr: { type: string }
    RevaluationBalance:
      type: object
      required: [id, productId, productName, warehouseName, quantity, avgCost, standardCost]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        warehouseName: { type: string }
        lotId: { type: [integer, "null"] }
        variantId: { type: [integer, "null"] }
        quantity: { type: string }
        avgCost: { type: string }
        standardCost: { type: string }
    InventoryRevaluation:
      type: object
      required: [id, quantId, productName, warehouseName, quantity, oldCost, targetCost, oldValue, newValue, delta, status, reason, varianceAccountId, createdBy, createdAt]
      properties:
        id: { type: integer }
        quantId: { type: integer }
        productName: { type: string }
        warehouseName: { type: string }
        quantity: { type: string }
        oldCost: { type: string }
        targetCost: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        delta: { type: string }
        status: { type: string, enum: [preview, confirmed, posted, cancelled] }
        reason: { type: string }
        varianceAccountId: { type: integer }
        createdBy: { type: integer }
        approvedBy: { type: [integer, "null"] }
        journalEntryId: { type: [integer, "null"] }
        createdAt: { type: string }
        confirmedAt: { type: [string, "null"] }
        approvedAt: { type: [string, "null"] }
    VatStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [registered, voluntary, not_registered]
        rolling12mSales: { type: number }
        percentOfMandatory: { type: number }
        near80: { type: boolean }
        crossedMandatory: { type: boolean }
        eligibleVoluntary: { type: boolean }
        remainingToMandatory: { type: number }
        mandatoryThreshold: { type: number }
        voluntaryThreshold: { type: number }
        computedAt: { type: string }
        vatNumber: { type: string, nullable: true }
        vatRegistrationDate: { type: string, nullable: true }
      required: [status, rolling12mSales, percentOfMandatory, near80, crossedMandatory, eligibleVoluntary, remainingToMandatory, mandatoryThreshold, voluntaryThreshold, computedAt]
    VatReturnResponse:
